<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Classic Tetris game built with vanilla JavaScript" />
    <title>Tetris Game</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top Control Buttons -->
      <div class="top-controls">
        <button id="startBtn" class="btn btn-primary">スタート</button>
        <button id="pauseBtn" class="btn btn-secondary" disabled>ポーズ</button>
        <button id="resetBtn" class="btn btn-secondary">リセット</button>
      </div>

      <header>
        <h1>TETRIS</h1>
        <p>Classic Tetris Game</p>
      </header>

      <main>
        <div class="game-container">
          <!-- Left Panel: Game Board -->
          <div class="game-board-container">
            <canvas id="gameCanvas"></canvas>
          </div>

          <!-- Right Panel: Info & Controls -->
          <div class="game-info">
            <!-- Stats Bar: Horizontal Stats Display -->
            <div id="stats-bar">
              <!-- Score Display -->
              <div class="info-panel">
                <h2>スコア</h2>
                <div id="score" class="stat-value">0</div>
              </div>

              <!-- Level Display -->
              <div class="info-panel">
                <h2>レベル</h2>
                <div id="level" class="stat-value">1</div>
              </div>

              <!-- Lines Display -->
              <div class="info-panel">
                <h2>ライン</h2>
                <div id="lines" class="stat-value">0</div>
              </div>

              <!-- High Score Display -->
              <div class="info-panel">
                <h2>ハイスコア</h2>
                <div id="highScore" class="stat-value">0</div>
              </div>
            </div>

            <!-- Next Piece Preview -->
            <div class="info-section">
              <h2>ネクスト</h2>
              <div class="next-piece-container">
                <canvas id="nextPieceCanvas"></canvas>
              </div>
            </div>

            <!-- Touch Controls Hint (Mobile Only) -->
            <div class="touch-hint">
              <h3>📱 タッチ操作</h3>
              <p>
                スワイプ: 左右・下移動<br>
                タップ: 回転
              </p>
            </div>

            <!-- Key Controls Guide (Desktop Only) -->
            <div class="controls-guide">
              <h3>⌨️ キーボード操作</h3>
              <ul>
                <li><kbd>←</kbd> <kbd>→</kbd> 移動</li>
                <li><kbd>↓</kbd> ソフトドロップ</li>
                <li><kbd>↑</kbd> 回転</li>
                <li><kbd>Space</kbd> ハードドロップ</li>
                <li><kbd>P</kbd> / <kbd>Esc</kbd> ポーズ</li>
              </ul>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <p>&copy; 2025 Tetris Web Game</p>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
